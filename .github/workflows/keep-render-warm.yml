name: Keep Render API warm

# Render free web services sleep after ~15 minutes of inactivity. A scheduled
# health check keeps the API awake so the first Vercel request does not hit a
# 502 during Render's 30–60 second cold start.
#
# GitHub Actions uses UTC. Every 10 minutes stays inside Render's idle window.
# If your Render URL changes, update HEALTH_URL below.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          HEALTH_URL: https://spendwise-api-eugc.onrender.com/api/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$HEALTH_URL" || true)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Render did not return 200 within the retry window."
          exit 1
